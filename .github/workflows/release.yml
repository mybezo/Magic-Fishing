name: Release MagicFishing

# Builds the jar and publishes a GitHub Release with it attached. Two ways to start it:
#  - Actions tab > "Release MagicFishing" > Run workflow, and enter a version (the tag is created for you)
#  - push a tag like v1.0.0 (stable) or v1.0.0-dev.1 (dev snapshot)
# Versions with a suffix (1.0.0-dev.1, 1.0.0-beta) are published as pre-releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without "v" (e.g. 1.0.0-dev.2 or 1.0.0)'
        required: true
        default: '1.0.0-dev.1'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Read version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then VERSION="${{ inputs.version }}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
              echo "> ⚠️ **Dev snapshot**: experimental build for testing. Back up your server before using it."
              echo
            fi
            echo "**Requirements:** Paper 1.20+, Java 17+, Slimefun4 RC-37."
            echo
            echo "**Install:** put \`MagicFishing-$VERSION.jar\` in \`plugins/\` next to Slimefun and restart the server."
            echo
            # The "## <version>" section of CHANGELOG.md, without its heading.
            awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md
            echo
            echo "See the [README](https://github.com/${{ github.repository }}#readme) for items, recipes and configuration."
          } > release-notes.md
          cat release-notes.md
      - name: Build JAR
        run: gradle shadowJar --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Magic Fishing ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: release-notes.md
          files: build/libs/MagicFishing-*.jar
          overwrite_files: true
